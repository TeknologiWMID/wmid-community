<style>
  /* Tab pengurus: menempel di bawah header, bisa digeser di ponsel */
  .admin-tabs { border-bottom: 1px solid var(--line); margin-bottom: var(--s-6); }
  .admin-tabs-in { display:flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .admin-tabs-in::-webkit-scrollbar { display: none; }
  .anav-link {
    display:inline-flex; align-items:center; gap: 8px; min-height: 48px; padding: 0 14px; flex-shrink: 0;
    font-size: var(--t-14); font-weight: 700; color: var(--ink-2); text-decoration: none; white-space: nowrap;
  }
  .anav-link:first-child { padding-left: 2px; }
  .anav-link:hover { color: var(--ink); }
  .anav-link.is-active { color: var(--ink); box-shadow: inset 0 -3px 0 var(--primary); }
  @media (max-width: 720px) {
    .admin-tabs { margin: calc(-1 * var(--s-4)) calc(-1 * var(--s-4)) var(--s-4); background: var(--surface); }
    .admin-tabs-in { padding-inline: var(--s-2); }
  }
</style>

<script>
// Pencarian di halaman pengurus: kirim otomatis setelah berhenti mengetik.
function adminSearch(form, delay) {
  clearTimeout(form._t);
  form._t = setTimeout(function() { form.submit(); }, delay || 450);
}
// Pilihan saringan: di desktop langsung terkirim saat diganti.
// Di ponsel, pilihan dikumpulkan di lembar bawah lalu dikirim dengan tombol "Tampilkan hasil".
function adminFilterChange(sel) {
  if (window.matchMedia('(max-width: 720px)').matches) return;
  sel.form.submit();
}
document.addEventListener('DOMContentLoaded', function() {
  var q = document.querySelector('.filter-form input[name="q"]');
  if (q && q.value) {
    q.focus();
    var v = q.value;
    q.value = '';
    q.value = v;
  }
  document.querySelectorAll('.filter-form').forEach(function(form) {
    var openBtn = form.querySelector('.filter-toggle');
    var closeBtn = form.querySelector('.filter-close');
    var scrim = document.getElementById('filter-scrim');
    if (!openBtn) return;
    function set(open) {
      form.classList.toggle('is-sheet-open', open);
      openBtn.setAttribute('aria-expanded', String(open));
      if (scrim) scrim.hidden = !open;
      document.body.style.overflow = open ? 'hidden' : '';
      if (open) { var f = form.querySelector('.filter-field select'); if (f) f.focus(); }
      else openBtn.focus();
    }
    openBtn.addEventListener('click', function() { set(true); });
    if (closeBtn) closeBtn.addEventListener('click', function() { set(false); });
    if (scrim) scrim.addEventListener('click', function() { set(false); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && form.classList.contains('is-sheet-open')) set(false); });
  });
});
</script>

<nav class="admin-tabs" aria-label="Menu pengurus">
  <div class="admin-tabs-in">
    <a href="{% url 'admin_dashboard' %}" class="anav-link {% if active_admin == 'dashboard' %}is-active{% endif %}" {% if active_admin == 'dashboard' %}aria-current="page"{% endif %}>Ringkasan</a>
    <a href="{% url 'admin_anggota' %}" class="anav-link {% if active_admin == 'anggota' %}is-active{% endif %}" {% if active_admin == 'anggota' %}aria-current="page"{% endif %}>Anggota</a>
    <a href="{% url 'admin_komunitas' %}" class="anav-link {% if active_admin == 'komunitas' %}is-active{% endif %}" {% if active_admin == 'komunitas' %}aria-current="page"{% endif %}>Komunitas</a>
    <a href="{% url 'admin_kegiatan_data' %}" class="anav-link {% if active_admin == 'kegiatan' %}is-active{% endif %}" {% if active_admin == 'kegiatan' %}aria-current="page"{% endif %}>Kegiatan</a>
    <a href="{% url 'admin_verifikasi' %}" class="anav-link {% if active_admin == 'verifikasi' %}is-active{% endif %}" {% if active_admin == 'verifikasi' %}aria-current="page"{% endif %}>
      Verifikasi{% if pending_count %} <span class="count-pill" aria-label="{{ pending_count }} menunggu">{{ pending_count }}</span>{% endif %}
    </a>
  </div>
</nav>
