<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halaman tidak ditemukan · Direktori Anggota WMID</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    :root { --bg:#F2F4F7; --surface:#FFFFFF; --line:#D2DAE3; --line-strong:#7A8795; --ink:#14212B; --ink-2:#46525E; --muted:#56626E; --primary:#0B5C8E; --primary-strong:#084A73; --primary-soft:#DDEAF4; --on-primary:#FFFFFF; --accent:#F2B233; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; line-height: 1.55; }
    header { background: var(--surface); border-bottom: 1px solid var(--line); }
    header a { display: inline-flex; flex-direction: column; justify-content: center; height: 60px; padding: 0 16px; color: var(--ink); text-decoration: none; line-height: 1.15; }
    header b { font-weight: 800; } header small { font-size: 12px; color: var(--muted); }
    main { max-width: 560px; margin: 0 auto; padding: 56px 16px; text-align: center; }
    svg { width: 120px; height: 120px; color: var(--primary); }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin: 20px 0 8px; }
    p { color: var(--ink-2); margin: 0; }
    code { font-family: 'IBM Plex Mono', monospace; font-size: .92em; background: var(--primary-soft); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 6px; font-weight: 700; font-size: 14px; text-decoration: none; border: 1px solid transparent; }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-primary:hover { background: var(--primary-strong); }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    @media (max-width: 480px) { .actions .btn { flex: 1; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <header><a href="/"><b>Direktori Anggota</b><small>Wikimedia Indonesia</small></a></header>
  <main>
    <svg viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 18v90M44 108h32"/>
      <path d="M60 30h36l10 10-10 10H60z" fill="var(--primary-soft)"/>
      <path d="M60 58H26L16 68l10 10h34z" fill="var(--accent)" stroke="currentColor"/>
    </svg>
    <h1>Halaman ini tidak ada</h1>
    <p>Alamat <code>{{ request.path }}</code> tidak ditemukan. Mungkin tautannya salah ketik atau halamannya sudah dipindah.</p>
    <div class="actions">
      <a href="javascript:history.back()" class="btn btn-secondary">Kembali</a>
      <a href="/" class="btn btn-primary">Ke beranda</a>
    </div>
  </main>
</body>
</html>
